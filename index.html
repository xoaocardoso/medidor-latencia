<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Medidor de Latência</title>
<button id="go" style="font-size:24px;padding:16px">Medir</button>
<button id="cp" style="font-size:24px;padding:16px">Copiar</button>
<p><a href="https://github.com/xoaocardoso/medidor-latencia/releases/latest/download/medidor-latencia.apk" style="font-size:22px">Baixar app nativo (APK)</a></p>
<pre id="out" style="white-space:pre-wrap;font-size:18px">v2 leve. Volume médio, carro em silêncio. 10 cliques, ~25 s.</pre>
<script>
const N = 10, GAP = 2, WIN = 1.9, CH = 0.01;
const out = document.getElementById('out');
let mic = null, txt = '';
const W = "class R extends AudioWorkletProcessor{constructor(){super();this.b=new Float32Array(2048);this.n=0;this.s=-1}process(i){const c=i[0]&&i[0][0];if(c){if(this.s<0)this.s=currentFrame;this.b.set(c,this.n);this.n+=c.length;if(this.n>=this.b.length){this.port.postMessage({s:this.s,d:this.b.slice(0)});this.n=0;this.s=-1}}return true}}registerProcessor('r',R)";

function chirp(sr) {
  const n = Math.round(CH * sr), o = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const t = i / sr, w = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1));
    o[i] = w * Math.sin(2 * Math.PI * (800 * t + 4200 * t * t / (2 * CH)));
  }
  return o;
}

async function recorder(ctx, src, ch) {
  try {
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([W], { type: 'application/javascript' })));
    const n = new AudioWorkletNode(ctx, 'r');
    n.port.onmessage = e => ch.push(e.data);
    src.connect(n);
    return [n, 'preciso'];
  } catch (e) {}
  const z = 1024, n = ctx.createScriptProcessor(z, 1, 1);
  n.onaudioprocess = e => ch.push({ s: Math.round(e.playbackTime * ctx.sampleRate) - z, d: e.inputBuffer.getChannelData(0).slice() });
  src.connect(n);
  return [n, 'compativel'];
}

function find(r, f0, t, a, b) {
  a -= f0; b = Math.min(b - f0, r.length - t.length);
  if (a < 1 || b <= a) return null;
  const B = 96, E = [];
  for (let i = a; i + B <= b; i += B) {
    let e = 0;
    for (let j = i; j < i + B; j++) { const d = r[j] - r[j - 1]; e += d * d; }
    E.push(e);
  }
  let m = 0;
  for (let k = 1; k < E.length; k++) if (E[k] > E[m]) m = k;
  const s = E.slice().sort((x, y) => x - y), med = s[s.length >> 1] || 1e-12;
  const c0 = Math.max(a, a + m * B - 960), c1 = Math.min(b, a + m * B + 960);
  let best = -1, bi = c0;
  for (let i = c0; i < c1; i++) {
    let v = 0;
    for (let j = 0; j < t.length; j++) v += r[i + j] * t[j];
    v = Math.abs(v);
    if (v > best) { best = v; bi = i; }
  }
  return { f: bi + f0, q: E[m] / med };
}

async function run() {
  const go = document.getElementById('go');
  go.disabled = true;
  let ctx;
  try {
    out.textContent = 'Pedindo o microfone...';
    if (!mic || !mic.getAudioTracks().some(t => t.readyState === 'live'))
      mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    ctx = new AudioContext({ latencyHint: 0 });
    const ch = [], src = ctx.createMediaStreamSource(mic);
    const [node, mode] = await recorder(ctx, src, ch);
    const g = ctx.createGain(); g.gain.value = 0;
    node.connect(g); g.connect(ctx.destination);
    const sr = ctx.sampleRate, t = chirp(sr), buf = ctx.createBuffer(1, t.length, sr);
    buf.copyToChannel(t, 0);
    const t0 = ctx.currentTime + 0.5, em = [];
    for (let k = 0; k < N; k++) {
      const s = ctx.createBufferSource(); s.buffer = buf; s.connect(ctx.destination);
      s.start(t0 + k * GAP); em.push(Math.round((t0 + k * GAP) * sr));
    }
    out.textContent = 'Tocando 10 cliques...';
    await new Promise(r => setTimeout(r, (0.5 + (N - 1) * GAP + WIN + 0.5) * 1000));
    const c0 = performance.now();
    if (!ch.length) throw new Error('microfone sem audio');
    const f0 = Math.min(...ch.map(c => c.s)), end = Math.max(...ch.map(c => c.s + c.d.length));
    const r = new Float32Array(end - f0);
    for (const c of ch) r.set(c.d, c.s - f0);
    const lat = [];
    for (let k = 0; k < N; k++) {
      const h = find(r, f0, t, em[k], em[k] + Math.round(WIN * sr));
      lat.push(h && h.q >= 10 ? (h.f - em[k]) / sr * 1000 : null);
    }
    const calc = performance.now() - c0;
    const ok = lat.filter(x => x !== null), o = ok.slice().sort((a, b) => a - b);
    const decl = ((ctx.baseLatency || 0) + (ctx.outputLatency || 0)) * 1000;
    let res = `v2 leve | modo ${mode} | ${sr} Hz | declarada ${decl.toFixed(0)} ms | calculo ${calc.toFixed(0)} ms\n`;
    res += `cliques ${ok.length}/${N}: ${lat.map(x => x === null ? 'x' : x.toFixed(0)).join(' ')}\n`;
    if (ok.length >= 3) {
      const avg = ok.reduce((a, b) => a + b, 0) / ok.length;
      const sd = Math.sqrt(ok.reduce((a, b) => a + (b - avg) ** 2, 0) / ok.length);
      res += `media ${avg.toFixed(1)} | mediana ${o[o.length >> 1].toFixed(1)} | variacao ${(o[o.length - 1] - o[0]).toFixed(1)} | DP ${sd.toFixed(1)} ms\n`;
    } else res += 'poucos cliques: suba o volume e repita\n';
    txt = res + navigator.userAgent;
    out.textContent = txt;
  } catch (e) {
    out.textContent = 'Erro: ' + (e && e.message ? e.message : e);
  } finally {
    if (ctx) ctx.close();
    go.disabled = false;
  }
}

document.getElementById('go').onclick = run;
document.getElementById('cp').onclick = async () => {
  try { await navigator.clipboard.writeText(txt); } catch (e) {}
};
</script>

plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.xoaocardoso.medidor'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.xoaocardoso.medidor'
        minSdk 29
        targetSdk 34
        versionCode 5
        versionName '5.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
